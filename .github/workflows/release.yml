# Publishes a Hush release whenever a version tag (e.g. v0.2.0) is pushed.
# Installed copies of Hush find it within a few hours, or straight away via
# Hush Browser › Check for Updates…
#
# To release: put the new version in the VERSION file, commit, then
#   git tag v0.2.0 && git push origin main v0.2.0
name: Release

on:
  push:
    tags: ['v*']
  # Lets a release be run again from GitHub (Actions › Release › Run workflow), e.g. if
  # GitHub's Mac machines were too busy to pick the job up. Choose the version's tag to run it on.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    # The most the build itself may take once a Mac picks it up.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # A tag push must match VERSION. Run by hand (from main), it releases whatever VERSION says,
      # as long as that version isn't already published.
      - name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="$(cat VERSION)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$FILE" ]; then echo "Tag v$TAG doesn't match VERSION ($FILE)"; exit 1; fi
          elif gh release view "v$FILE" >/dev/null 2>&1; then
            echo "Hush $FILE is already released."; exit 1
          fi

      # In its own Python environment: the runner's system Python refuses package installs.
      - name: Install the installer-window tool
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgenv"
          "$RUNNER_TEMP/dmgenv/bin/python3" -m pip install --quiet dmgbuild
          echo "$RUNNER_TEMP/dmgenv/bin" >> "$GITHUB_PATH"

      - name: Build app, update zip and installer
        run: ./scripts/build-app.sh

      # Installed copies of Hush only accept updates signed with this key. If the secret isn't
      # set (Settings › Secrets and variables › Actions › HUSH_UPDATE_KEY), nothing is released.
      - name: Sign the update
        env:
          HUSH_UPDATE_KEY: ${{ secrets.HUSH_UPDATE_KEY }}
        run: |
          V="$(cat VERSION)"
          swift scripts/sign-update.swift "build/HushBrowser-$V.zip" > "build/HushBrowser-$V.zip.sig"

      # The release notes start with this version's "What's new" from CHANGELOG.md, exactly as
      # Hush shows it after updating, followed by install instructions.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION)"
          gh release create "v$V" --target "$GITHUB_SHA" \
            "build/HushBrowser-$V.dmg" \
            "build/HushBrowser-$V.zip" \
            "build/HushBrowser-$V.zip.sig" \
            --title "Hush Browser $V" \
            --notes "$(awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '1{/^$/d}'; echo; sed "s/VERSION/$V/g" .github/release-notes.md)"
